<center>

<!-- ######################################################## -->
<!--<img src="figs/Traffic_Flow_and_General.png" width="65%"></img>-->
<h3>Flujo de tránsito y ajustes generales</h3>
<!-- ######################################################## -->

<table id="mainTable" border="0" cellspacing="1" cellpadding="0" >

<tr>
  <td class="important"><label for="slider_qIn">Flujo de entrada</label></td>
  <td> <input id="slider_qIn" type="range"
              min="0" max="6000" step="10"></td>
  <td> <div id="slider_qInVal"></div> </td>
</tr>

<tr>
  <td class="important"><label for="slider_qOn">Flujo de incorporación</label></td>
  <td> <input id="slider_qOn" type="range"
              min="0" max="2000" step="10"></td>
  <td> <div id="slider_qOnVal"></div> </td>
</tr>

  <td><label for="slider_fracTruck">Porcentaje de camiones</label></td>
  <td> <input id="slider_fracTruck" type="range"
              min="0" max="50" step="1"></td>
  <td> <div id="slider_fracTruckVal"></div> </td>
</tr>

<tr>
  <td><label for="slider_timewarp">Velocidad de simulación</label></td>
  <td> <input id="slider_timewarp" type="range"
              min="0.2" max="20" step="0.1"></td>
  <td> <div id="slider_timewarpVal"></div> </td>
</tr>
</table>


<!-- ######################################################## -->
<!--<img src="figs/Car-Following_Behavior.png" width="60%"></img>-->
<h3>Seguimiento de vehículos</h3>
<!-- ######################################################## -->

<table id="mainTable" border="0" cellspacing="1" cellpadding="0" >

<tr>
  <td><label for="slider_IDM_v0">Velocidad deseada v<sub>0</sub></label></td>
  <td> <input id="slider_IDM_v0" type="range"
              min="20" max="160" step="1"></td>
  <td> <div id="slider_IDM_v0Val"></div> </td>
</tr>

<tr>
  <td><label for="slider_IDM_T">Intervalo de seguridad T</label></td>
  <td> <input id="slider_IDM_T" type="range"
              min="0.6" max="3" step="0.1"></td>
  <td> <div id="slider_IDM_TVal"></div> </td>
</tr>

<tr>
  <td class="important"><label for="slider_IDM_a">Aceleración máxima a</label></td>
  <td> <input id="slider_IDM_a" type="range"
              min="0.3" max="4" step="0.1"></td>
  <td> <div id="slider_IDM_aVal"></div> </td>
</tr>
</table>


<!-- ######################################################## -->
<!--<img src="figs/Lane-Changing_Behavior.png" width="60%"></img>-->
<h3>Cambios de carril</h3>
<!-- ######################################################## -->

<table id="mainTable" border="0" cellspacing="1" cellpadding="0" >

<tr>
  <td><label for="slider_MOBIL_p">Factor de cortesía</label></td>
  <td> <input id="slider_MOBIL_p" type="range"
              min="-0.2" max="1" step="0.1"></td>
  <td> <div id="slider_MOBIL_pVal"></div> </td>
</tr>

<tr>
  <td><label for="slider_MOBIL_bThr">Umbral de cambio</label></td>
  <td> <input id="slider_MOBIL_bThr" type="range"
              min="-0.1" max="1" step="0.1"></td>
  <td> <div id="slider_MOBIL_bThrVal"></div> </td>
</tr>

<tr>
  <td><label for="slider_MOBIL_bBiasRight_car">Preferencia por la derecha (autos)</label></td>
  <td> <input id="slider_MOBIL_bBiasRight_car" type="range"
              min="-1" max="2" step="0.1"></td>
  <td> <div id="slider_MOBIL_bBiasRight_carVal"></div> </td>
</tr>

<tr>
  <td><label for="slider_MOBIL_bBiasRight_truck">Preferencia por la derecha (camiones)</label></td>
  <td> <input id="slider_MOBIL_bBiasRight_truck" type="range"
              min="-1" max="2" step="0.1"></td>
  <td> <div id="slider_MOBIL_bBiasRight_truckVal"></div> </td>
</tr>
</table>
